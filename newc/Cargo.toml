[package]
name = "newc"
version = "1.0.0"
edition = "2024"

[[bin]]
name = "newc"
path = "src/main.rs"

[dependencies]
newc-core = { path = "../newc-core" }
iced = { version = "0.14", features = ["tokio", "highlighter", "canvas"] }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
anyhow = "1.0"
rfd = "0.15"
dirs = "6.0"
chrono = "0.4"
toml = "0.8"
serde_json = "1.0"
notify = "6"
tokio = { version = "1", features = ["time"] }
futures = "0.3"

