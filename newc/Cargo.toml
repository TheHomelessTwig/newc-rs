[package]
name = "newc"
version = "1.0.2"
edition = "2024"
description = "GUI-driven C project scaffolding and management tool"
license = "MIT"
repository = "https://github.com/TheHomelessTwig/newc-rs"
authors = ["TheHomelessTwig"]

[[bin]]
name = "newc"
path = "src/main.rs"

[package.metadata.deb]
maintainer = "TheHomelessTwig <thehomelesstwig@outlook.com>"
copyright = "2026, TheHomelessTwig"
extended-description = "newc scaffolds C projects (Makefile/CMake), manages modules, and provides a GUI (function library, build runner, static analysis) plus a CLI for the same operations."
depends = "$auto"
section = "devel"
priority = "optional"
assets = [
    ["target/release/newc", "usr/bin/", "755"],
    ["../packaging/newc.desktop", "usr/share/applications/newc.desktop", "644"],
    ["../packaging/newc.svg", "usr/share/icons/hicolor/scalable/apps/newc.svg", "644"],
]

[dependencies]
newc-core = { path = "../newc-core" }
iced = { version = "0.14", features = ["tokio", "highlighter", "canvas"] }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
anyhow = "1.0"
rfd = "0.15"
dirs = "6.0"
chrono = "0.4"
toml = "0.8"
serde_json = "1.0"
notify = "6"
tokio = { version = "1", features = ["time"] }
futures = "0.3"

[build-dependencies]
winres = "0.1"

