[package]
name = "newc"
version = "0.1.11"
edition = "2024"

[[bin]]
name = "newc"
path = "src/main.rs"

[dependencies]
newc-core = { path = "../newc-core" }
eframe = { version = "0.31", default-features = false, features = ["glow", "persistence", "wayland", "x11"] }
egui = "0.31"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
crossbeam-channel = "0.5"
anyhow = "1.0"
rfd = "0.15"
dirs = "6.0"
chrono = "0.4"
