[[functions]]
name = "array_input_int"
module = "array"
description = "Prompt user to fill each element of an int array"
signature = "void array_input_int(int arr[], int size, const char *question, int show_count)"
tags = ["array", "int", "input", "interactive"]
requires = ["prompt_for_int"]
header_code = "/* Prompts user to fill each element of an int array individually */\nvoid array_input_int(int arr[], int size, const char *question, int show_count);"
impl_code = """
/*
 * Function:
 *     array_input_int
 * Input:
 *     arr - the int array to fill
 *     size - the number of elements in arr
 *     question - prompt to display before each input
 *     show_count - 1 to append the element number to the prompt, 0 otherwise
 * Output:
 *     None
 * Algorithm:
 *     for each element build prompt with count if show_count is 1
 *     call prompt_for_int and store the result
 */
void array_input_int(int arr[], int size, const char *question, int show_count)
{
	char prompt[256];
	for (int i = 0; i < size; i++) {
		if (show_count) {
			snprintf(prompt, sizeof(prompt), "%s %d: ", question, i + 1);
			arr[i] = prompt_for_int(prompt);
		} else {
			arr[i] = prompt_for_int(question);
		}
	}
}
"""

