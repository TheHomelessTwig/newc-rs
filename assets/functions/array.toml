[[functions]]
name = "array_find_sorted"
module = "array"
description = "Binary search in sorted int array; returns index or -1"
signature = "int array_find_sorted(int arr[], int size, int value)"
tags = ["array", "int", "search", "binary-search"]
requires = []
header_code = "/* Binary search — returns index of value in sorted arr, or -1 if not found */\nint array_find_sorted(int arr[], int size, int value);"
impl_code = """
/*
 * Function:
 *     array_find_sorted
 * Input:
 *     arr - a sorted array to search
 *     size - the number of elements in arr
 *     value - the value to search for
 * Output:
 *     index of value if found, -1 otherwise
 * Algorithm:
 *     binary search: set low and high bounds
 *     while low <= high calculate mid
 *         if arr[mid] equals value return mid
 *         if arr[mid] < value search upper half
 *         else search lower half
 *     return -1 if not found
 */
int array_find_sorted(int arr[], int size, int value)
{
	int low = 0;
	int high = size - 1;
	while (low <= high) {
		int mid = low + (high - low) / 2;
		if (arr[mid] == value) {
			return mid;
		} else if (arr[mid] < value) {
			low = mid + 1;
		} else {
			high = mid - 1;
		}
	}
	return -1;
}
"""

