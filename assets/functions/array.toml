[[functions]]
name = "array_sort_asc"
module = "array"
description = "Sort int array ascending (bubble sort)"
signature = "void array_sort_asc(int arr[], int size)"
tags = ["array", "int", "sort", "ascending"]
requires = []
header_code = "/* Sorts arr in ascending order */\nvoid array_sort_asc(int arr[], int size);"
impl_code = """
/*
 * Function:
 *     array_sort_asc
 * Input:
 *     arr - the array to sort
 *     size - the number of elements in arr
 * Output:
 *     None
 * Algorithm:
 *     bubble sort: repeatedly step through arr comparing adjacent elements
 *     swap them if they are in the wrong order until no swaps are needed
 */
void array_sort_asc(int arr[], int size)
{
	for (int i = 0; i < size - 1; i++) {
		for (int j = 0; j < size - i - 1; j++) {
			if (arr[j] > arr[j + 1]) {
				int temp = arr[j];
				arr[j] = arr[j + 1];
				arr[j + 1] = temp;
			}
		}
	}
}
"""

