[[functions]]
name = "prompt_for_char"
module = "input"
description = "Prompt user for a single non-whitespace character"
signature = "char prompt_for_char(const char *question)"
tags = ["input", "char", "validation"]
requires = ["clear_input_buffer"]
header_code = "/* Prompts user and returns a single non-whitespace character */\nchar prompt_for_char(const char *question);"
impl_code = """
/*
 * Function:
 *     prompt_for_char
 * Input:
 *     question - a string which is the question to ask the user
 * Output:
 *     c - the character input by the user
 * Algorithm:
 *     while true
 *         print question
 *         read a non-whitespace character from user
 *         if read was successful clear buffer and return c
 *         else clear input buffer and print invalid input
 */
char prompt_for_char(const char *question)
{
	char c;
	while (1) {
		printf("%s", question);
		if (scanf(" %c", &c) == 1) {
			clear_input_buffer();
			return c;
		} else {
			clear_input_buffer();
			puts("Invalid input.");
		}
	}
}
"""

[[functions]]
name = "prompt_for_string"
module = "input"
description = "Prompt user for a non-empty string (stored in buffer)"
signature = "void prompt_for_string(const char *question, char *buffer, int max_len)"
tags = ["input", "string", "validation"]
requires = []
header_code = "/* Prompts user and stores a non-empty string into buffer (max_len includes null terminator) */\nvoid prompt_for_string(const char *question, char *buffer, int max_len);"
impl_code = """
/*
 * Function:
 *     prompt_for_string
 * Input:
 *     question - a string which is the question to ask the user
 *     buffer - char array to store the result in
 *     max_len - maximum length including null terminator
 * Output:
 *     void - result stored in buffer
 * Algorithm:
 *     while true
 *         print question
 *         read line into buffer with fgets
 *         strip trailing newline if present
 *         if buffer is non-empty return
 *         else print invalid input message
 */
void prompt_for_string(const char *question, char *buffer, int max_len)
{
	while (1) {
		printf("%s", question);
		if (fgets(buffer, max_len, stdin) != NULL) {
			int len = (int)strlen(buffer);
			if (len > 0 && buffer[len - 1] == '\\n') {
				buffer[len - 1] = '\\0';
			}
			if (buffer[0] != '\\0') {
				return;
			}
		}
		puts("Invalid input, please enter a non-empty string.");
	}
}
"""

