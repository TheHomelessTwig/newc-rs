[[functions]]
name = "user_Yy_Nn_choice"
module = "input"
description = "Prompt user for Y/N, returns 1 (yes) or 0 (no)"
signature = "int user_Yy_Nn_choice(const char *question)"
tags = ["input", "bool", "interactive"]
requires = ["clear_input_buffer"]
header_code = "/* Prompts user with a Y/N question, returns 1 for yes, 0 for no */\nint user_Yy_Nn_choice(const char *question);"
impl_code = """
/*
 * Function:
 *     user_Yy_Nn_choice
 * Input:
 *     question - a string which is the question to ask the user
 * Output:
 *     1 if user inputs yes, 0 if user inputs no
 * Algorithm:
 *     while true
 *         clear input buffer
 *         print question and (Y/N)
 *         read char from user
 *         if char is Y/y/N/n break loop
 *         else print invalid input
 *     if char is Y/y return 1
 *     else return 0
 */
int user_Yy_Nn_choice(const char *question)
{
	char response;
	while (1) {
		clear_input_buffer();
		printf("%s (Y/N): ", question);
		int scan_result = scanf("%c", &response);
		if (scan_result == 1 && (response == 'N' || response == 'Y' ||
		    response == 'n' || response == 'y')) {
			break;
		} else {
			puts("Invalid input.");
		}
	}
	printf("\\n");
	int result = response == 'Y' || response == 'y' ? 1 : 0;
	return result;
}
"""

[[functions]]
name = "prompt_for_int"
module = "input"
description = "Prompt user for a valid integer"
signature = "int prompt_for_int(const char *question)"
tags = ["input", "int", "validation"]
requires = ["clear_input_buffer"]
header_code = "/* Prompts user and returns a valid integer */\nint prompt_for_int(const char *question);"
impl_code = """
/*
 * Function:
 *     prompt_for_int
 * Input:
 *     question - a string which is the question to ask the user
 * Output:
 *     i - the integer value input by the user
 * Algorithm:
 *     while true
 *         print question
 *         read integer from user and store in i
 *         if read was successful return i
 *         else clear input buffer and print invalid input
 */
int prompt_for_int(const char *question)
{
	int i;
	while (1) {
		printf("%s", question);
		int scan_result = scanf("%i", &i);
		if (scan_result == 1) {
			return i;
		} else {
			clear_input_buffer();
			puts("Invalid input, please enter an integer.");
		}
	}
}
"""

[[functions]]
name = "prompt_for_int_in_range"
module = "input"
description = "Prompt user for integer within [min, max]"
signature = "int prompt_for_int_in_range(const char *question, int min, int max)"
tags = ["input", "int", "range", "validation"]
requires = ["prompt_for_int", "clear_input_buffer"]
header_code = "/* Prompts user and returns an integer within [min, max] */\nint prompt_for_int_in_range(const char *question, int min, int max);"
impl_code = """
/*
 * Function:
 *     prompt_for_int_in_range
 * Input:
 *     question - a string which is the question to ask the user
 *     min - the minimum value of the range
 *     max - the maximum value of the range
 * Output:
 *     i - the integer value input by the user which is between min and max
 * Algorithm:
 *     while true
 *         call prompt_for_int to get an integer from user
 *         if i is between min and max return i
 *         else print invalid input message
 */
int prompt_for_int_in_range(const char *question, int min, int max)
{
	while (1) {
		int i = prompt_for_int(question);
		if (is_int_in_range(i, min, max) == 1) {
			return i;
		} else {
			printf("Invalid input, please input an integer between "
			       "%i and %i.\\n",
			       min, max);
		}
	}
}
"""

