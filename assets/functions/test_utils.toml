[[functions]]
name = "assert_double_near"
module = "test_utils"
description = "Assert two doubles are within tolerance of each other; prints PASS or FAIL"
signature = "void assert_double_near(double expected, double actual, double tolerance, const char *label)"
tags = ["testing", "assert", "double", "float", "tolerance"]
requires = ["stdio.h", "math.h"]
header_code = "/* Assert that two doubles are equal within tolerance */\nvoid assert_double_near(double expected, double actual, double tolerance, const char *label);"
impl_code = '''
/*
 * Function:
 *     assert_double_near
 * Input:
 *     expected  - expected double value
 *     actual    - actual double value
 *     tolerance - acceptable difference (e.g. 0.0001)
 *     label     - description
 * Output:
 *     None — prints PASS if |expected - actual| <= tolerance
 */
void assert_double_near(double expected, double actual, double tolerance, const char *label)
{
	if (fabs(expected - actual) <= tolerance) {
		printf("  [PASS] %s\n", label);
		g_passed++;
	} else {
		printf("  [FAIL] %s — expected %.6f, got %.6f (tolerance %.6f)\n",
		       label, expected, actual, tolerance);
		g_failed++;
	}
}
'''

[[functions]]
name = "test_run"
module = "test_utils"
description = "Run a named test function and print its name as a header"
signature = "void test_run(const char *name, void (*test_fn)(void))"
tags = ["testing", "runner", "function pointer"]
requires = ["stdio.h"]
header_code = "/* Run a named test function; updates pass/fail counters */\nvoid test_run(const char *name, void (*test_fn)(void));"
impl_code = '''
/*
 * Function:
 *     test_run
 * Input:
 *     name    - human-readable test name printed as header
 *     test_fn - function pointer to the test body (takes no args, returns void)
 * Output:
 *     None — runs test_fn and prints header
 */
void test_run(const char *name, void (*test_fn)(void))
{
	printf("[TEST] %s\n", name);
	test_fn();
}
'''

[[functions]]
name = "print_test_summary"
module = "test_utils"
description = "Print final pass/fail summary to stdout"
signature = "void print_test_summary(void)"
tags = ["testing", "summary", "report"]
requires = ["stdio.h"]
header_code = "/* Print final summary: passed/total */\nvoid print_test_summary(void);"
impl_code = '''
/*
 * Function:
 *     print_test_summary
 * Input:
 *     None
 * Output:
 *     None — prints final pass/fail summary
 */
void print_test_summary(void)
{
	int total = g_passed + g_failed;
	printf("\n========================================\n");
	printf("Results: %d / %d passed", g_passed, total);
	if (g_failed == 0) {
		printf(" — ALL PASS\n");
	} else {
		printf(" — %d FAILED\n", g_failed);
	}
	printf("========================================\n");
}
'''
