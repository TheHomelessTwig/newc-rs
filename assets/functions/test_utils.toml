module = "test_utils"

[[functions]]
name = "assert_int_eq"
module = "test_utils"
description = "Assert two integers are equal; prints PASS or FAIL with values to stdout"
signature = "void assert_int_eq(int expected, int actual, const char *label)"
tags = ["testing", "assert", "int", "equality"]
requires = ["stdio.h"]
header_code = "/* Assert that two integers are equal; prints PASS/FAIL with values */\nvoid assert_int_eq(int expected, int actual, const char *label);"
impl_code = '''
/*
 * Function:
 *     assert_int_eq
 * Input:
 *     expected - the expected integer value
 *     actual   - the actual integer value
 *     label    - description of the assertion
 * Output:
 *     None — prints PASS or FAIL to stdout; updates counters
 * Algorithm:
 *     compare expected and actual; print result
 */
void assert_int_eq(int expected, int actual, const char *label)
{
	if (expected == actual) {
		printf("  [PASS] %s\n", label);
		g_passed++;
	} else {
		printf("  [FAIL] %s — expected %d, got %d\n", label, expected, actual);
		g_failed++;
	}
}
'''

[[functions]]
name = "assert_str_eq"
module = "test_utils"
description = "Assert two strings are equal; prints PASS or FAIL with values"
signature = "void assert_str_eq(const char *expected, const char *actual, const char *label)"
tags = ["testing", "assert", "string", "equality"]
requires = ["stdio.h", "string.h"]
header_code = "/* Assert that two strings are equal; prints PASS/FAIL */\nvoid assert_str_eq(const char *expected, const char *actual, const char *label);"
impl_code = '''
/*
 * Function:
 *     assert_str_eq
 * Input:
 *     expected - expected string
 *     actual   - actual string
 *     label    - description of the assertion
 * Output:
 *     None — prints PASS or FAIL
 * Algorithm:
 *     strcmp; print match or mismatch
 */
void assert_str_eq(const char *expected, const char *actual, const char *label)
{
	if (strcmp(expected, actual) == 0) {
		printf("  [PASS] %s\n", label);
		g_passed++;
	} else {
		printf("  [FAIL] %s — expected \"%s\", got \"%s\"\n", label, expected, actual);
		g_failed++;
	}
}
'''

