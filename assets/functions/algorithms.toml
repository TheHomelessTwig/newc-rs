name = "str_to_upper"
module = "algorithms"
description = "Convert all lowercase letters in a string to uppercase in-place"
signature = "void str_to_upper(char *s)"
tags = ["string", "case", "uppercase"]
requires = []
header_code = "/* Converts all lowercase letters in s to uppercase in-place */\nvoid str_to_upper(char *s);"
impl_code = '''
/*
 * Function:
 *     str_to_upper
 * Input:
 *     s - null-terminated string to modify
 * Output:
 *     None (modifies s in-place)
 * Algorithm:
 *     for each character, if lowercase convert to uppercase
 */
void str_to_upper(char *s)
{
	while (*s != '\0') {
		if (*s >= 'a' && *s <= 'z') {
			*s = (char)(*s - 'a' + 'A');
		}
		s++;
	}
}
'''

