[[functions]]
name = "insertion_sort"
module = "algorithms"
description = "Sort int array using insertion sort — efficient for small/nearly-sorted arrays"
signature = "void insertion_sort(int arr[], int size)"
tags = ["sort", "int", "insertion", "O(n²)"]
requires = []
header_code = "/* Sorts arr in-place using insertion sort */\nvoid insertion_sort(int arr[], int size);"
impl_code = '''
/*
 * Function:
 *     insertion_sort
 * Input:
 *     arr  - the integer array to sort
 *     size - number of elements
 * Output:
 *     None (sorts in-place)
 * Algorithm:
 *     for each element from index 1 onward
 *         save it as key
 *         shift all larger preceding elements right by one
 *         insert key into the gap
 */
void insertion_sort(int arr[], int size)
{
	for (int i = 1; i < size; i++) {
		int key = arr[i];
		int j = i - 1;
		while (j >= 0 && arr[j] > key) {
			arr[j + 1] = arr[j];
			j--;
		}
		arr[j + 1] = key;
	}
}
'''

[[functions]]
name = "selection_sort"
module = "algorithms"
description = "Sort int array using selection sort — always O(n²) but minimal swaps"
signature = "void selection_sort(int arr[], int size)"
tags = ["sort", "int", "selection", "O(n²)"]
requires = []
header_code = "/* Sorts arr in-place using selection sort */\nvoid selection_sort(int arr[], int size);"
impl_code = '''
/*
 * Function:
 *     selection_sort
 * Input:
 *     arr  - the integer array to sort
 *     size - number of elements
 * Output:
 *     None (sorts in-place)
 * Algorithm:
 *     for each position i from 0 to size-2
 *         find the index of the minimum element from i onward
 *         swap arr[i] with the minimum element
 */
void selection_sort(int arr[], int size)
{
	for (int i = 0; i < size - 1; i++) {
		int min_idx = i;
		for (int j = i + 1; j < size; j++) {
			if (arr[j] < arr[min_idx]) {
				min_idx = j;
			}
		}
		if (min_idx != i) {
			int temp = arr[i];
			arr[i] = arr[min_idx];
			arr[min_idx] = temp;
		}
	}
}
'''

[[functions]]
name = "merge_sort_helper"
module = "algorithms"
description = "Internal merge helper for merge_sort — merges two sorted halves"
signature = "static void merge_sort_helper(int arr[], int left, int mid, int right)"
tags = ["sort", "int", "merge", "internal"]
requires = []
header_code = ""
impl_code = '''
/*
 * Function:
 *     merge_sort_helper
 * Input:
 *     arr   - the array
 *     left  - start index of left half
 *     mid   - end index of left half
 *     right - end index of right half
 * Output:
 *     None (merges in-place)
 * Algorithm:
 *     copy left and right halves into temporary arrays
 *     merge them back in sorted order
 */
static void merge_sort_helper(int arr[], int left, int mid, int right)
{
	int n1 = mid - left + 1;
	int n2 = right - mid;
	int L[n1], R[n2];
	for (int i = 0; i < n1; i++) L[i] = arr[left + i];
	for (int j = 0; j < n2; j++) R[j] = arr[mid + 1 + j];
	int i = 0, j = 0, k = left;
	while (i < n1 && j < n2) {
		if (L[i] <= R[j]) arr[k++] = L[i++];
		else arr[k++] = R[j++];
	}
	while (i < n1) arr[k++] = L[i++];
	while (j < n2) arr[k++] = R[j++];
}
'''

[[functions]]
name = "merge_sort"
module = "algorithms"
description = "Sort int array using merge sort — stable, O(n log n). Call as merge_sort(arr, 0, size-1)"
signature = "void merge_sort(int arr[], int left, int right)"
tags = ["sort", "int", "merge", "O(n log n)", "stable"]
requires = ["merge_sort_helper"]
header_code = "/* Sorts arr[left..right] using merge sort. Call: merge_sort(arr, 0, size-1) */\nvoid merge_sort(int arr[], int left, int right);"
impl_code = '''
/*
 * Function:
 *     merge_sort
 * Input:
 *     arr   - the integer array to sort
 *     left  - start index (usually 0)
 *     right - end index (usually size-1)
 * Output:
 *     None (sorts in-place)
 * Algorithm:
 *     if left < right
 *         find midpoint
 *         recursively sort left half
 *         recursively sort right half
 *         merge the two sorted halves
 */
void merge_sort(int arr[], int left, int right)
{
	if (left < right) {
		int mid = left + (right - left) / 2;
		merge_sort(arr, left, mid);
		merge_sort(arr, mid + 1, right);
		merge_sort_helper(arr, left, mid, right);
	}
}
'''

[[functions]]
name = "quick_sort_partition"
module = "algorithms"
description = "Internal partition helper for quick_sort"
signature = "static int quick_sort_partition(int arr[], int low, int high)"
tags = ["sort", "int", "quick", "internal"]
requires = []
header_code = ""
impl_code = '''
/*
 * Function:
 *     quick_sort_partition
 * Input:
 *     arr  - the array
 *     low  - start index
 *     high - end index (pivot)
 * Output:
 *     final index of pivot after partitioning
 * Algorithm:
 *     use last element as pivot
 *     move all elements <= pivot to the left of i
 *     place pivot at i+1
 */
static int quick_sort_partition(int arr[], int low, int high)
{
	int pivot = arr[high];
	int i = low - 1;
	for (int j = low; j < high; j++) {
		if (arr[j] <= pivot) {
			i++;
			int temp = arr[i];
			arr[i] = arr[j];
			arr[j] = temp;
		}
	}
	int temp = arr[i + 1];
	arr[i + 1] = arr[high];
	arr[high] = temp;
	return i + 1;
}
'''

[[functions]]
name = "quick_sort"
module = "algorithms"
description = "Sort int array using quick sort — O(n log n) average. Call as quick_sort(arr, 0, size-1)"
signature = "void quick_sort(int arr[], int low, int high)"
tags = ["sort", "int", "quick", "O(n log n)"]
requires = ["quick_sort_partition"]
header_code = "/* Sorts arr[low..high] using quick sort. Call: quick_sort(arr, 0, size-1) */\nvoid quick_sort(int arr[], int low, int high);"
impl_code = '''
/*
 * Function:
 *     quick_sort
 * Input:
 *     arr  - the integer array to sort
 *     low  - start index (usually 0)
 *     high - end index (usually size-1)
 * Output:
 *     None (sorts in-place)
 * Algorithm:
 *     if low < high
 *         partition array around pivot
 *         recursively sort left and right of pivot
 */
void quick_sort(int arr[], int low, int high)
{
	if (low < high) {
		int pi = quick_sort_partition(arr, low, high);
		quick_sort(arr, low, pi - 1);
		quick_sort(arr, pi + 1, high);
	}
}
'''

[[functions]]
name = "gcd"
module = "algorithms"
description = "Greatest common divisor of two integers (Euclidean algorithm)"
signature = "int gcd(int a, int b)"
tags = ["math", "gcd", "euclidean"]
requires = []
header_code = "/* Returns the greatest common divisor of a and b */\nint gcd(int a, int b);"
impl_code = '''
/*
 * Function:
 *     gcd
 * Input:
 *     a - first integer
 *     b - second integer
 * Output:
 *     greatest common divisor of a and b
 * Algorithm:
 *     Euclidean: while b != 0, a = b, b = a mod b
 */
int gcd(int a, int b)
{
	while (b != 0) {
		int temp = b;
		b = a % b;
		a = temp;
	}
	return a;
}
'''

