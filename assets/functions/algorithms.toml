 * Input:
 *     a - first integer
 *     b - second integer
 * Output:
 *     least common multiple of a and b
 * Algorithm:
 *     lcm(a, b) = |a * b| / gcd(a, b)
 */
int lcm(int a, int b)
{
	return (a / gcd(a, b)) * b;
}
'''

[[functions]]
name = "is_prime"
module = "algorithms"
description = "Returns 1 if n is prime, 0 otherwise — trial division up to sqrt(n)"
signature = "int is_prime(int n)"
tags = ["math", "prime", "number-theory"]
requires = []
header_code = "/* Returns 1 if n is prime, 0 otherwise */\nint is_prime(int n);"
impl_code = '''
/*
 * Function:
 *     is_prime
 * Input:
 *     n - integer to test
 * Output:
 *     1 if n is prime, 0 otherwise
 * Algorithm:
 *     handle n < 2 as not prime
 *     check divisibility by 2, then odd numbers up to sqrt(n)
 */
int is_prime(int n)
{
	if (n < 2) return 0;
	if (n == 2) return 1;
	if (n % 2 == 0) return 0;
	for (int i = 3; (long)i * i <= (long)n; i += 2) {
		if (n % i == 0) return 0;
	}
	return 1;
}
'''

