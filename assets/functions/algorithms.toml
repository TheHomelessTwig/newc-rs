[[functions]]
name = "str_reverse"
module = "algorithms"
description = "Reverse a C string in-place"
signature = "void str_reverse(char *s)"
tags = ["string", "reverse"]
requires = []
header_code = "/* Reverses string s in-place */\nvoid str_reverse(char *s);"
impl_code = '''
/*
 * Function:
 *     str_reverse
 * Input:
 *     s - null-terminated string to reverse
 * Output:
 *     None (modifies s in-place)
 * Algorithm:
 *     swap characters from both ends toward the middle
 */
void str_reverse(char *s)
{
	int left = 0;
	int right = (int)strlen(s) - 1;
	while (left < right) {
		char temp = s[left];
		s[left] = s[right];
		s[right] = temp;
		left++;
		right--;
	}
}
'''

