impl_code = '''
/*
 * Function:
 *     str_trim_newline
 * Input:
 *     s - null-terminated string
 * Output:
 *     None (modifies s in-place)
 * Algorithm:
 *     find string length
 *     walk backwards replacing \n and \r with \0
 */
void str_trim_newline(char *s)
{
	int len = (int)strlen(s);
	while (len > 0 && (s[len - 1] == '\n' || s[len - 1] == '\r')) {
		s[--len] = '\0';
	}
}
'''

[[functions]]
name = "interpolation_search"
module = "algorithms"
description = "Interpolation search in uniformly distributed sorted int array. O(log log n) average."
signature = "int interpolation_search(int arr[], int size, int value)"
tags = ["search", "int", "interpolation", "sorted"]
requires = []
header_code = "/* Interpolation search in sorted arr. Returns index or -1 if not found. */\nint interpolation_search(int arr[], int size, int value);"
impl_code = '''
/*
 * Function:
 *     interpolation_search
 * Input:
 *     arr   - sorted integer array
 *     size  - number of elements
 *     value - value to find
 * Output:
 *     index of value if found, -1 otherwise
 * Algorithm:
 *     estimate position using linear interpolation between low and high
 *     narrow range based on comparison with estimated position
 */
int interpolation_search(int arr[], int size, int value)
{
	int low = 0;
	int high = size - 1;
	while (low <= high && value >= arr[low] && value <= arr[high]) {
		if (arr[high] == arr[low]) {
			return (arr[low] == value) ? low : -1;
		}
		int pos = low + (int)(((long)(value - arr[low]) * (high - low))
		          / (arr[high] - arr[low]));
		if (arr[pos] == value) return pos;
		if (arr[pos] < value) low = pos + 1;
		else high = pos - 1;
	}
	return -1;
}
'''

