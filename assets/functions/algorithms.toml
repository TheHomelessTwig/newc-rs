impl_code = '''
/*
 * Function:
 *     factorial
 * Input:
 *     n - non-negative integer
 * Output:
 *     n! as a long, or -1 if n < 0
 * Algorithm:
 *     multiply result by each integer from 1 to n
 */
long factorial(int n)
{
	if (n < 0) return -1;
	long result = 1;
	for (int i = 2; i <= n; i++) {
		result *= (long)i;
	}
	return result;
}
'''

[[functions]]
name = "fibonacci"
module = "algorithms"
description = "Returns the nth Fibonacci number (iterative, 0-indexed: fib(0)=0, fib(1)=1)"
signature = "long fibonacci(int n)"
tags = ["math", "fibonacci", "sequence"]
requires = []
header_code = "/* Returns the nth Fibonacci number (0-indexed, iterative) */\nlong fibonacci(int n);"
impl_code = '''
/*
 * Function:
 *     fibonacci
 * Input:
 *     n - index (0-based)
 * Output:
 *     nth Fibonacci number as long
 * Algorithm:
 *     iteratively compute F(n) using two variables
 */
long fibonacci(int n)
{
	if (n <= 0) return 0;
	if (n == 1) return 1;
	long a = 0, b = 1;
	for (int i = 2; i <= n; i++) {
		long c = a + b;
		a = b;
		b = c;
	}
	return b;
}
'''

[[functions]]
name = "power_int"
module = "algorithms"
description = "Fast integer exponentiation: base^exp in O(log exp). Returns 0 for negative exp."
signature = "long power_int(long base, int exp)"
tags = ["math", "power", "exponentiation", "fast-pow"]
requires = []
header_code = "/* Returns base^exp using fast exponentiation. Negative exp returns 0. */\nlong power_int(long base, int exp);"
impl_code = '''
/*
 * Function:
 *     power_int
 * Input:
 *     base - the base value
 *     exp  - the exponent (non-negative integer)
 * Output:
 *     base raised to the power exp
 * Algorithm:
 *     binary exponentiation: if exp is odd multiply result by base,
 *     then square base and halve exp
 */
long power_int(long base, int exp)
{
	if (exp < 0) return 0;
	long result = 1;
	while (exp > 0) {
		if (exp % 2 == 1) result *= base;
		base *= base;
		exp /= 2;
	}
	return result;
}
'''

