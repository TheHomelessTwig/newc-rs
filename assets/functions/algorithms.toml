 */
int rand_int_range(int min, int max)
{
	return min + rand() % (max - min + 1);
}
'''

[[functions]]
name = "array_shuffle"
module = "algorithms"
description = "Randomly shuffle an int array in-place (Fisher-Yates). Seed srand first."
signature = "void array_shuffle(int arr[], int size)"
tags = ["array", "int", "shuffle", "random"]
requires = ["rand_int_range"]
header_code = "/* Shuffles arr in-place using Fisher-Yates algorithm */\nvoid array_shuffle(int arr[], int size);"
impl_code = '''
/*
 * Function:
 *     array_shuffle
 * Input:
 *     arr  - the integer array to shuffle
 *     size - number of elements
 * Output:
 *     None (shuffles in-place)
 * Algorithm:
 *     Fisher-Yates: for i from size-1 down to 1
 *         pick random j in [0, i]
 *         swap arr[i] with arr[j]
 */
void array_shuffle(int arr[], int size)
{
	for (int i = size - 1; i > 0; i--) {
		int j = rand_int_range(0, i);
		int temp = arr[i];
		arr[i] = arr[j];
		arr[j] = temp;
	}
}
'''
