[[functions]]
name = "str_reverse"
module = "strings"
description = "Reverse a string in-place using two-pointer technique"
signature = "void str_reverse(char *str)"
tags = ["string", "reverse", "two-pointer"]
requires = ["str_length"]
header_code = "/* Reverses str in-place */\nvoid str_reverse(char *str);"
impl_code = '''
/*
 * Function:
 *     str_reverse
 * Input:
 *     str - string to reverse in-place
 * Output:
 *     None — str modified directly
 * Algorithm:
 *     swap characters from both ends walking inward
 */
void str_reverse(char *str)
{
	int left = 0;
	int right = str_length(str) - 1;
	while (left < right) {
		char tmp = str[left];
		str[left]  = str[right];
		str[right] = tmp;
		left++;
		right--;
	}
}
'''

[[functions]]
name = "str_compare"
module = "strings"
description = "Compare two strings: returns 0 if equal, negative if a < b, positive if a > b"
signature = "int str_compare(const char *a, const char *b)"
tags = ["string", "compare", "lexicographic"]
requires = []
header_code = "/* Returns 0 if a == b, negative if a < b, positive if a > b */\nint str_compare(const char *a, const char *b);"
impl_code = '''
/*
 * Function:
 *     str_compare
 * Input:
 *     a, b - strings to compare
 * Output:
 *     0 if equal, negative if a < b, positive if a > b
 * Algorithm:
 *     compare characters until difference or null terminator
 */
int str_compare(const char *a, const char *b)
{
	while (*a != '\0' && *a == *b) {
		a++;
		b++;
	}
	return (unsigned char)*a - (unsigned char)*b;
}
'''

