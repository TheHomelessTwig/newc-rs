impl_code = '''
/*
 * Function:
 *     str_contains_char
 * Input:
 *     str - the string to search
 *     c   - the character to look for
 * Output:
 *     1 if c is found in str, 0 otherwise
 * Algorithm:
 *     scan each character; return 1 on match
 */
int str_contains_char(const char *str, char c)
{
	for (int i = 0; str[i] != '\0'; i++) {
		if (str[i] == c) {
			return 1;
		}
	}
	return 0;
