[[functions]]
name = "str_trim"
module = "strings"
description = "Strip leading and trailing whitespace from a string in-place"
signature = "void str_trim(char *str)"
tags = ["string", "trim", "whitespace"]
requires = ["ctype.h", "str_length"]
header_code = "/* Strips leading and trailing whitespace from str in-place */\nvoid str_trim(char *str);"
impl_code = '''
/*
 * Function:
 *     str_trim
 * Input:
 *     str - string to trim in-place
 * Output:
 *     None — leading and trailing whitespace removed
 * Algorithm:
 *     find first and last non-whitespace; shift and null-terminate
 */
void str_trim(char *str)
{
	int start = 0;
	while (str[start] != '\0' && isspace((unsigned char)str[start])) {
		start++;
	}
	int end = str_length(str) - 1;
	while (end >= start && isspace((unsigned char)str[end])) {
		end--;
	}
	int len = end - start + 1;
	for (int i = 0; i < len; i++) {
		str[i] = str[start + i];
	}
	str[len] = '\0';
}
'''

