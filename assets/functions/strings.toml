[[functions]]
name = "str_length"
module = "strings"
description = "Return the length of a string (number of chars before null terminator)"
signature = "int str_length(const char *str)"
tags = ["string", "length", "utility"]
requires = []
header_code = "/* Returns the length of str (not counting null terminator) */\nint str_length(const char *str);"
impl_code = '''
/*
 * Function:
 *     str_length
 * Input:
 *     str - the string to measure
 * Output:
 *     number of characters before the null terminator
 * Algorithm:
 *     walk pointer until null terminator, count steps
 */
int str_length(const char *str)
{
	int len = 0;
	while (str[len] != '\0') {
		len++;
	}
	return len;
}
'''

[[functions]]
name = "str_copy_safe"
module = "strings"
description = "Copy src into dst safely — always null-terminates, truncates if needed"
signature = "void str_copy_safe(char *dst, const char *src, int dst_size)"
tags = ["string", "copy", "safe", "buffer"]
requires = []
header_code = "/* Copies src into dst safely; dst_size is total buffer size including null terminator */\nvoid str_copy_safe(char *dst, const char *src, int dst_size);"
impl_code = '''
/*
 * Function:
 *     str_copy_safe
 * Input:
 *     dst      - destination buffer
 *     src      - source string
 *     dst_size - total size of dst including null terminator
 * Output:
 *     None — result written into dst, always null-terminated
 * Algorithm:
 *     copy at most dst_size - 1 characters, then append null terminator
 */
void str_copy_safe(char *dst, const char *src, int dst_size)
{
	int i;
	for (i = 0; i < dst_size - 1 && src[i] != '\0'; i++) {
		dst[i] = src[i];
	}
	dst[i] = '\0';
}
'''

[[functions]]
name = "str_to_upper"
module = "strings"
description = "Convert all characters in a string to uppercase in-place"
signature = "void str_to_upper(char *str)"
tags = ["string", "case", "uppercase"]
requires = ["ctype.h"]
header_code = "/* Converts all characters in str to uppercase in-place */\nvoid str_to_upper(char *str);"
impl_code = '''
/*
 * Function:
 *     str_to_upper
 * Input:
 *     str - string to convert in-place
 * Output:
 *     None — str modified directly
 * Algorithm:
 *     for each character apply toupper
 */
void str_to_upper(char *str)
{
	for (int i = 0; str[i] != '\0'; i++) {
		str[i] = (char)toupper((unsigned char)str[i]);
	}
}
'''

