name = "str_count_char"
module = "strings"
description = "Count how many times a character appears in a string"
signature = "int str_count_char(const char *str, char c)"
tags = ["string", "count", "char"]
requires = []
header_code = "/* Returns the number of times c appears in str */\nint str_count_char(const char *str, char c);"
impl_code = '''
/*
 * Function:
 *     str_count_char
 * Input:
 *     str - the string to search
 *     c   - the character to count
 * Output:
 *     number of times c appears in str
 * Algorithm:
 *     scan string incrementing counter on each match
 */
int str_count_char(const char *str, char c)
{
	int count = 0;
	for (int i = 0; str[i] != '\0'; i++) {
		if (str[i] == c) {
			count++;
		}
	}
	return count;
}
'''

[[functions]]
name = "str_is_palindrome"
module = "strings"
description = "Return 1 if the string reads the same forwards and backwards, 0 otherwise"
signature = "int str_is_palindrome(const char *str)"
tags = ["string", "palindrome", "two-pointer"]
requires = ["str_length"]
header_code = "/* Returns 1 if str is a palindrome, 0 otherwise */\nint str_is_palindrome(const char *str);"
impl_code = '''
/*
 * Function:
 *     str_is_palindrome
 * Input:
 *     str - the string to test
 * Output:
 *     1 if str reads identically forwards and backwards, 0 otherwise
 * Algorithm:
 *     compare characters from both ends walking inward; fail on mismatch
 */
int str_is_palindrome(const char *str)
{
	int left = 0;
	int right = str_length(str) - 1;
	while (left < right) {
		if (str[left] != str[right]) {
			return 0;
		}
		left++;
		right--;
	}
	return 1;
}
'''
