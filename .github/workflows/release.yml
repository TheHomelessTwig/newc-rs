name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Install Linux system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            pkg-config \
            libgl1-mesa-dev \
            libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxinerama-dev \
            libwayland-dev libxkbcommon-dev \
            libfontconfig-dev libfreetype-dev
      - name: Run tests
        run: cargo test --workspace

  build:
    name: Build ${{ matrix.name }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            name: newc-x86_64-linux
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            name: newc-aarch64-linux
          - target: aarch64-apple-darwin
            os: macos-latest
            name: newc-aarch64-macos
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            name: newc-x86_64-windows.exe

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            pkg-config \
            libgl1-mesa-dev \
            libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxinerama-dev \
            libwayland-dev libxkbcommon-dev \
            libfontconfig-dev libfreetype-dev

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Stage binary (Unix)
        if: runner.os != 'Windows'
        run: cp target/${{ matrix.target }}/release/newc ${{ matrix.name }}

      - name: Stage binary (Windows)
        if: runner.os == 'Windows'
        run: cp target/${{ matrix.target }}/release/newc.exe ${{ matrix.name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}

      - name: Build .deb package
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          mkdir -p target/man
          target/${{ matrix.target }}/release/newc internal-man target/man
          gzip -9 -n target/man/newc.1
          cargo install cargo-deb --locked
          cargo deb -p newc --target ${{ matrix.target }} --no-build

      - name: Upload .deb artifact
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        uses: actions/upload-artifact@v7
        with:
          name: newc-amd64-deb
          path: target/${{ matrix.target }}/debian/*.deb

      # Assembles a real /Applications-ready newc.app for the Homebrew Cask
      # (and anyone downloading it directly) — using only sips+iconutil
      # (stock CLI tools, no WindowServer/qlmanage dependency) against the
      # pre-rendered packaging/newc.png.
      - name: Assemble newc.app bundle (macOS)
        if: matrix.target == 'aarch64-apple-darwin'
        run: |
          set -euo pipefail
          APP=newc.app
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp "target/${{ matrix.target }}/release/newc" "$APP/Contents/MacOS/newc"
          chmod +x "$APP/Contents/MacOS/newc"
          cp packaging/Info.plist "$APP/Contents/Info.plist"

          ICONSET=newc.iconset
          mkdir -p "$ICONSET"
          for sz in 16 32 64 128 256 512 1024; do
            sips -z "$sz" "$sz" packaging/newc.png --out "$sz.png"
          done
          cp 16.png   "$ICONSET/icon_16x16.png"
          cp 32.png   "$ICONSET/icon_16x16@2x.png"
          cp 32.png   "$ICONSET/icon_32x32.png"
          cp 64.png   "$ICONSET/icon_32x32@2x.png"
          cp 128.png  "$ICONSET/icon_128x128.png"
          cp 256.png  "$ICONSET/icon_128x128@2x.png"
          cp 256.png  "$ICONSET/icon_256x256.png"
          cp 512.png  "$ICONSET/icon_256x256@2x.png"
          cp 512.png  "$ICONSET/icon_512x512.png"
          cp 1024.png "$ICONSET/icon_512x512@2x.png"
          iconutil -c icns "$ICONSET" -o "$APP/Contents/Resources/newc.icns"

          ditto -c -k --sequesterRsrc --keepParent "$APP" newc-aarch64-macos.app.zip

      - name: Upload .app bundle artifact
        if: matrix.target == 'aarch64-apple-darwin'
        uses: actions/upload-artifact@v7
        with:
          name: newc-aarch64-macos-app
          path: newc-aarch64-macos.app.zip

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: Create release and upload binaries
        uses: softprops/action-gh-release@v3
        with:
          files: |
            newc-*
            *.deb
          generate_release_notes: true

  publish-packages:
    name: Publish to package managers
    needs: release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/checkout@v7

      # continue-on-error: until TheHomelessTwig.newc exists in the *merged*
      # microsoft/winget-pkgs (first submission is a pending PR, not merged
      # yet), this action errors out — that shouldn't block the independent
      # Homebrew steps below.
      - name: Publish to winget
        uses: vedantmgoyal2009/winget-releaser@v2
        continue-on-error: true
        with:
          identifier: TheHomelessTwig.newc
          installers-regex: 'newc-x86_64-windows\.exe$'
          token: ${{ secrets.WINGET_TOKEN }}

      # mislav/bump-homebrew-formula-action errors ("unexpected HTTP 303
      # response") against a fine-grained PAT — likely a fork-flow redirect
      # the action doesn't follow correctly with that token type. Plain git
      # (same approach as the Cask step below, which works fine with the
      # same token) sidesteps it entirely.
      - name: Bump Homebrew formula + cask
        if: always()
        env:
          COMMITTER_TOKEN: ${{ secrets.COMMITTER_TOKEN }}
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#v}"
          TAR_SHA=$(curl -fsSL "https://github.com/${{ github.repository }}/archive/refs/tags/${GITHUB_REF_NAME}.tar.gz" | sha256sum | cut -d' ' -f1)
          APP_SHA=$(curl -fsSL "https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/newc-aarch64-macos.app.zip" | sha256sum | cut -d' ' -f1)

          git clone "https://x-access-token:${COMMITTER_TOKEN}@github.com/TheHomelessTwig/homebrew-newc.git" tap
          cd tap
          sed -i "s|archive/refs/tags/v[0-9.]*\.tar\.gz|archive/refs/tags/${GITHUB_REF_NAME}.tar.gz|" Formula/newc.rb
          sed -i "s/^  sha256 \".*\"/  sha256 \"${TAR_SHA}\"/" Formula/newc.rb
          sed -i "s/^  version \".*\"/  version \"${VER}\"/" Casks/newc.rb
          sed -i "s/^  sha256 \".*\"/  sha256 \"${APP_SHA}\"/" Casks/newc.rb
          git -c user.name="github-actions[bot]" \
              -c user.email="github-actions[bot]@users.noreply.github.com" \
              commit -am "Bump Formula + Cask to ${VER}"
          git push

      # Self-hosted apt repo (GitHub Pages, served from the gh-pages branch)
      # via reprepro. Pulls the .deb already built in the `build` job's
      # GitHub Release rather than rebuilding it.
      - name: Publish to apt repo
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y reprepro

          gh release download "${GITHUB_REF_NAME}" --repo "${{ github.repository }}" \
            --pattern '*.deb' --dir /tmp --clobber
          mv /tmp/*.deb /tmp/newc.deb

          export GNUPGHOME="$(mktemp -d)"
          printf '%s\n' "$APT_GPG_PRIVATE_KEY" | gpg --batch --import

          git clone --branch gh-pages --single-branch \
            "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" pages
          cd pages/apt
          reprepro includedeb stable /tmp/newc.deb

          cd ..
          git add apt
          git -c user.name="github-actions[bot]" \
              -c user.email="github-actions[bot]@users.noreply.github.com" \
              commit -m "apt: add ${GITHUB_REF_NAME}"
          git push

      # AUR publishing is deferred — AUR account signups are currently closed.
      # Once an account + SSH key exist, uncomment and set AUR_SSH_PRIVATE_KEY
      # (see packaging/RELEASING.md):
      #
      # - name: Bump AUR PKGBUILD version
      #   run: sed -i "s/^pkgver=.*/pkgver=${GITHUB_REF_NAME#v}/" packaging/aur/PKGBUILD
      #
      # - name: Publish to AUR
      #   uses: KSXGitHub/github-actions-deploy-aur@v4.1.3
      #   with:
      #     pkgname: newc-bin
      #     pkgbuild: ./packaging/aur/PKGBUILD
      #     updpkgsums: true
      #     commit_username: TheHomelessTwig
      #     commit_email: thehomelesstwig@outlook.com
      #     ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
      #     commit_message: "Update to ${{ github.ref_name }}"
